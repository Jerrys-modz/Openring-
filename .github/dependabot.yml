version: 2
updates:
  # Expo pins React Native/Expo packages and the tooling around them (jest-expo, eslint-config-expo,
  # typescript-eslint) per SDK, so skip every major bump and take SDK upgrades deliberately with
  # `expo install`. A group PR of majors (TypeScript 7, ESLint 10, Jest 30) broke lint in CI.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: react
      - dependency-name: react-native
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
